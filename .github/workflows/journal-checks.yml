name: journal checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      reason:
        description: "reason for running the checks"
        required: true
        type: string
  schedule:
    - cron: "0 6 * * 1"

jobs:
  check-journal:
    runs-on: ubuntu-latest
    steps:
      - name: check out repo
        uses: actions/checkout@v5

      - name: print manual run reason
        if: github.event_name == 'workflow_dispatch'
        env:
          REASON: ${{ github.event.inputs.reason }}
        run: echo "Manual run reason : $REASON "

      - name: check readme.md
        run: test -f README.md

      - name: check no .md file is empty
        run:  |
          for file in $(find . -name "*.md"); do
            if [ ! -=s "$file" ]; then
              echo"Error: $file is empty"
              exit 1
            fi
          done

      - name: check no .env file was commited
        run:  |
          if [ -n "$(find . -name  '.env' -o -name '*.env'" ]; then
            echo "Error: .env file found in repo"
            exit
          fi
